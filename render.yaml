services:
  - type: web
    name: redmansionmind-rag
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python src/server.py --host 0.0.0.0"
    envVars:
      - key: OPENAI_BASE_URL
        value: https://api.deepseek.com
      - key: OPENAI_MODEL
        value: deepseek-chat
      - key: OPENAI_API_KEY
        sync: false
